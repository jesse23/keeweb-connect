name: Release

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            publish:
                description: 'Publish to the Chrome Web Store after upload (default: upload a draft only)'
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: Verify, build and package
        runs-on: ubuntu-latest
        timeout-minutes: 20
        outputs:
            version: ${{ steps.meta.outputs.version }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Tag must match manifest.json version
              if: github.ref_type == 'tag'
              env:
                  TAG: ${{ github.ref_name }}
              run: npm run release:check -- "$TAG"
            - run: npm run format:check
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run test:unit
            - run: npm run build
            - run: npx playwright install --with-deps chromium
            - run: npx playwright test
            - run: npm run package
            - id: meta
              run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
            - uses: actions/upload-artifact@v4
              with:
                  name: extension-zip
                  path: dist/keeweb-connect-chrome-*.zip
                  if-no-files-found: error
                  retention-days: 30

    github-release:
        name: GitHub Release
        if: github.ref_type == 'tag'
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: extension-zip
                  path: dist
            - name: Create release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG: ${{ github.ref_name }}
              run: |
                  gh release create "$TAG" dist/keeweb-connect-chrome-*.zip \
                    --title "$TAG" --generate-notes --verify-tag

    cws-precheck:
        name: Check Chrome Web Store secrets
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            configured: ${{ steps.check.outputs.configured }}
        steps:
            - id: check
              env:
                  CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
                  CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                  CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                  CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
              run: |
                  missing=""
                  for name in CHROME_EXTENSION_ID CHROME_PUBLISHER_ID CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN; do
                    if [ -z "${!name}" ]; then missing="$missing $name"; fi
                  done
                  if [ -n "$missing" ]; then
                    echo "configured=false" >> "$GITHUB_OUTPUT"
                    echo "::notice title=Chrome Web Store::Skipping upload, missing repository secrets:$missing"
                  else
                    echo "configured=true" >> "$GITHUB_OUTPUT"
                  fi

    publish-chrome-store:
        name: Chrome Web Store
        needs: [build, cws-precheck]
        if: needs.cws-precheck.outputs.configured == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # Required reviewers on this environment gate every upload.
        environment: chrome-web-store
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: extension-zip
                  path: dist
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Upload to the Chrome Web Store
              env:
                  EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
                  CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                  CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                  REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
                  PUBLISH: ${{ inputs.publish }}
              run: |
                  zip="$(ls dist/keeweb-connect-chrome-*.zip)"
                  # No command = upload only (draft). 'publish' submits the uploaded version for review.
                  npx --yes chrome-webstore-upload-cli@4.0.2 upload --source "$zip"
                  if [ "$PUBLISH" = "true" ]; then
                    npx --yes chrome-webstore-upload-cli@4.0.2 publish
                  else
                    echo "::notice title=Chrome Web Store::Draft uploaded, not submitted for review (publish=false)"
                  fi
