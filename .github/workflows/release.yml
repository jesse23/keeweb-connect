name: Release

# Versions come from conventional commits on master (semantic-release, as in webtty):
# fix: -> patch, feat: -> minor, "!" or BREAKING CHANGE -> major. Other types do not release.

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: Verify, tag and release
        runs-on: ubuntu-latest
        timeout-minutes: 25
        permissions:
            contents: write
        outputs:
            version: ${{ steps.release.outputs.version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run lint
            - run: npm run typecheck
            - run: npm run test:unit
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
            # semantic-release computes the version, stamps package.json and manifest.json,
            # builds and zips the extension, commits the bump, tags vX.Y.Z and creates the
            # GitHub Release with the zip. It writes version=<x.y.z> to $GITHUB_OUTPUT only
            # when it released something.
            - name: Release
              id: release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release
            - name: Keep the zip for the store job
              if: steps.release.outputs.version != ''
              uses: actions/upload-artifact@v4
              with:
                  name: extension-zip
                  path: dist/keeweb-connect-chrome-*.zip
                  if-no-files-found: error
                  retention-days: 30

    publish-chrome-store:
        name: Chrome Web Store
        needs: release
        # Runs only when this push produced a new version. Set the repository variable
        # CWS_UPLOAD_ENABLED=true once the environment secrets exist, and CWS_PUBLISH=true to
        # also submit for review (the default uploads a draft).
        if: needs.release.outputs.version != '' && vars.CWS_UPLOAD_ENABLED == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        # The CHROME_* secrets live in this environment only, restricted to master, with
        # required reviewers gating every upload.
        environment: chrome-web-store
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: v${{ needs.release.outputs.version }}
            - uses: actions/download-artifact@v4
              with:
                  name: extension-zip
                  path: dist
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            # the uploader is a pinned devDependency, so the lockfile covers its tree
            - run: npm ci --ignore-scripts
            - name: Upload to the Chrome Web Store
              env:
                  EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
                  PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
                  CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
                  CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
                  REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
                  PUBLISH: ${{ vars.CWS_PUBLISH }}
              run: |
                  zip="$(ls dist/keeweb-connect-chrome-*.zip)"
                  npx --no-install chrome-webstore-upload upload --source "$zip"
                  if [ "$PUBLISH" = "true" ]; then
                    npx --no-install chrome-webstore-upload publish
                  else
                    echo "::notice title=Chrome Web Store::Draft uploaded, not submitted for review (CWS_PUBLISH is not true)"
                  fi
